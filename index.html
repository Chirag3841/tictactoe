<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic Tac Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1><i class="fas fa-times"></i> Ultimate Tic Tac Toe <i class="far fa-circle"></i></h1>
            <div class="game-modes">
                <button id="pvp-btn" class="active">Player vs Player</button>
                <button id="ai-btn">Play vs AI</button>
            </div>
        </header>

        <div class="game-board">
            <div class="scoreboard">
                <div class="player x-player">
                    <div class="player-icon"><i class="fas fa-times"></i></div>
                    <div class="player-name">Player X</div>
                    <div class="player-score" id="x-score">0</div>
                </div>
                <div class="player o-player">
                    <div class="player-icon"><i class="far fa-circle"></i></div>
                    <div class="player-name">Player O</div>
                    <div class="player-score" id="o-score">0</div>
                </div>
            </div>

            <div class="board" id="board"></div>

            <div class="game-status" id="game-status">Player X's Turn</div>
        </div>

        <div class="game-controls">
            <button id="reset-btn"><i class="fas fa-redo"></i> Reset Game</button>
            <button id="new-game-btn"><i class="fas fa-plus-circle"></i> New Game</button>
            <div class="sound-toggle">
                <input type="checkbox" id="sound-toggle" checked>
                <label for="sound-toggle"><i class="fas fa-volume-up"></i></label>
            </div>
        </div>
    </div>

    <audio id="click-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.mp3"></audio>
    <audio id="win-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>
    <audio id="draw-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-retro-arcade-lose-2027.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
