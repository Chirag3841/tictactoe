<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-th"></i> Sudoku Solver</h1>
            <p>Enter your Sudoku puzzle and let the solver do the magic!</p>
        </header>

        <div class="sudoku-container">
            <div class="sudoku-grid" id="sudoku-grid"></div>
            <div class="controls">
                <button id="solve-btn" class="btn solve-btn">
                    <i class="fas fa-magic"></i> Solve Sudoku
                </button>
                <button id="clear-btn" class="btn clear-btn">
                    <i class="fas fa-broom"></i> Clear Board
                </button>
                <button id="example-btn" class="btn example-btn">
                    <i class="fas fa-lightbulb"></i> Load Example
                </button>
            </div>
        </div>

        <div class="instructions">
            <h2>How to use:</h2>
            <ol>
                <li>Click on any empty cell to enter a number (1-9)</li>
                <li>Press "Solve Sudoku" to find the solution</li>
                <li>Use "Clear Board" to start over</li>
                <li>Try "Load Example" for a sample puzzle</li>
            </ol>
        </div>
    </div>

    <footer>
        <p>Created with <i class="fas fa-heart"></i> - Sudoku Solver</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
